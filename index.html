<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CPM Map</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<style>
/* Layout: desktop = side panel + map; phone = full-screen map, search floating on top, selected list in a bottom sheet. */
:root{
  --bg:#f3f5f9; --surface:#ffffff; --ink:#16202e; --muted:#5b687a; --line:#dce2ec;
  --accent:#1d5fd8; --accent-soft:#e7effd; --danger:#c4283a;
  --radius:12px; --hdr:56px;
  --font:'Noto Sans Thai',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
  --sheet-peek:92px;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:var(--font);font-size:15px;line-height:1.45;background:var(--bg);color:var(--ink);-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit}
.app{height:100%;display:flex;flex-direction:column}
header.top{flex:none;height:calc(var(--hdr) + env(safe-area-inset-top,0px));padding:env(safe-area-inset-top,0px) max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));display:flex;align-items:center;gap:12px;background:var(--surface);border-bottom:1px solid var(--line);position:relative;z-index:20}
.logo{width:36px;height:36px;border-radius:10px;background:var(--accent);display:grid;place-items:center;flex:none}
.logo svg{width:20px;height:20px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.top h1{margin:0;font-size:17px;font-weight:700;line-height:1.2}
.top p{margin:0;font-size:12px;color:var(--muted)}
.main{flex:1;min-height:0;display:flex;position:relative}

.panel{width:390px;flex:none;display:flex;flex-direction:column;min-height:0;background:var(--surface);border-right:1px solid var(--line);position:relative;z-index:10}
.grab{display:none}
.searchwrap{position:relative;padding:12px;border-bottom:1px solid var(--line);flex:none}
.search{display:flex;align-items:center;gap:8px;height:48px;padding:0 6px 0 12px;border:1.5px solid var(--line);border-radius:var(--radius);background:var(--bg)}
.search:focus-within{border-color:var(--accent);background:#fff;box-shadow:0 0 0 3px var(--accent-soft)}
.search svg{width:18px;height:18px;flex:none;fill:none;stroke:var(--muted);stroke-width:2;stroke-linecap:round}
.search input{flex:1;min-width:0;height:100%;border:0;outline:0;background:transparent;font:inherit;font-size:16px;color:var(--ink)}
.search .x{width:36px;height:36px;border:0;border-radius:50%;background:transparent;color:var(--muted);font-size:20px;cursor:pointer}
.search .x[hidden]{display:none}
.results{position:absolute;left:12px;right:12px;top:calc(100% - 6px);z-index:50;max-height:min(58vh,440px);overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 12px 32px rgba(22,32,46,.18)}
.results[hidden]{display:none}
.res-head{padding:8px 12px;font-size:12px;color:var(--muted);background:var(--bg);border-bottom:1px solid var(--line);position:sticky;top:0}
.result{display:grid;grid-template-columns:12px 1fr auto;gap:10px;align-items:start;width:100%;padding:10px 12px;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;cursor:pointer}
.result:last-child{border-bottom:0}
.result:hover,.result.act{background:var(--accent-soft)}
.dot{width:12px;height:12px;border-radius:50%;margin-top:5px;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.25)}
.code{font-family:var(--mono);font-weight:700;font-size:12.5px;word-break:break-all}
.nm{font-size:13.5px}
.sub{font-size:12px;color:var(--muted)}
.pick{align-self:center;font-size:12px;font-weight:600;padding:4px 10px;border-radius:99px;background:var(--accent);color:#fff;white-space:nowrap}
.result.on .pick{background:var(--accent-soft);color:var(--accent)}
.noresult{padding:18px 12px;color:var(--muted);font-size:14px}

.toolbar{flex:none;display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 12px}
.count{font-size:14px;margin-right:auto}
.count b{font-size:16px;font-variant-numeric:tabular-nums}
.tb{height:36px;padding:0 11px;border:1px solid var(--line);border-radius:9px;background:var(--surface);font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap}
.tb:hover{border-color:var(--accent);color:var(--accent)}
.tb.danger{color:var(--danger)}
.tb.danger:hover{border-color:var(--danger);color:var(--danger)}
.tb.armed{background:var(--danger);border-color:var(--danger);color:#fff}
.legend{flex:none;display:flex;flex-wrap:wrap;gap:6px 12px;padding:0 12px 10px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend .dot{margin:0;width:11px;height:11px}
.legend b{font-variant-numeric:tabular-nums;color:var(--ink);font-weight:600}
.list{flex:1;min-height:0;overflow:auto;padding:0 12px 16px;border-top:1px solid var(--line)}
.grp{margin:0;padding:12px 2px 6px;font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.02em;display:flex;justify-content:space-between}
.item{display:grid;grid-template-columns:12px 1fr auto auto;gap:6px 10px;align-items:center;padding:9px 6px 9px 12px;margin-bottom:6px;border:1px solid var(--line);border-radius:10px;cursor:pointer}
.item:hover{border-color:var(--accent);background:var(--accent-soft)}
.item .meta{min-width:0}
.nav{display:inline-flex;align-items:center;height:34px;padding:0 12px;border-radius:8px;background:var(--accent-soft);color:var(--accent);font-size:13px;font-weight:600;text-decoration:none}
.rm{width:34px;height:34px;border:0;border-radius:8px;background:transparent;color:var(--muted);font-size:20px;cursor:pointer}
.rm:hover{background:#fdecee;color:var(--danger)}
.empty{padding:28px 8px;text-align:center;color:var(--muted);font-size:14px}

.mapwrap{flex:1;min-width:0;position:relative;isolation:isolate;z-index:0}
#map{position:absolute;inset:0;background:#e8ecf2;font-family:var(--font)}
.hint{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:500;pointer-events:none;width:min(300px,80%);padding:16px 18px;border-radius:14px;background:rgba(255,255,255,.94);box-shadow:0 8px 28px rgba(22,32,46,.18);text-align:center}
.hint b{display:block;font-size:15px;margin-bottom:4px}
.hint span{font-size:13px;color:var(--muted)}
.toast{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);z-index:600;padding:10px 16px;border-radius:99px;background:var(--ink);color:#fff;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
.leaflet-popup-content{margin:12px 14px;font-family:var(--font);font-size:13.5px;line-height:1.45}
.pp-code{font-family:var(--mono);font-weight:700;font-size:12.5px;word-break:break-all}
.pp-name{font-weight:600;margin:2px 0 6px}
.pp dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:12.5px}
.pp dt{color:var(--muted)}
.pp dd{margin:0}
.pp-same{margin-top:8px;padding-top:8px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
.pp-same div{font-family:var(--mono);font-size:11.5px;color:var(--ink);word-break:break-all}
.pp-nav{display:block;margin-top:10px;padding:9px;border-radius:8px;background:var(--accent);color:#fff!important;text-align:center;text-decoration:none;font-weight:600}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

@media (max-width:800px){
  :root{--top:calc(var(--hdr) + env(safe-area-inset-top,0px))}
  .main{display:block}
  .mapwrap{position:absolute;left:0;right:0;top:0;bottom:calc(var(--sheet-peek) + env(safe-area-inset-bottom,0px))}
  .leaflet-control-zoom{display:none}
  .panel{position:absolute;left:0;right:0;bottom:0;width:auto;height:min(62%,520px);border-right:0;border-radius:18px 18px 0 0;box-shadow:0 -6px 24px rgba(22,32,46,.16);padding-bottom:env(safe-area-inset-bottom,0px);transition:height .22s ease}
  .panel.collapsed{height:calc(var(--sheet-peek) + env(safe-area-inset-bottom,0px))}
  .panel.collapsed .legend,.panel.collapsed .list{display:none}
  .grab{display:block;flex:none;width:100%;height:26px;border:0;background:transparent;cursor:pointer;position:relative}
  .grab::after{content:"";position:absolute;left:50%;top:10px;width:40px;height:5px;margin-left:-20px;border-radius:3px;background:var(--line)}
  .searchwrap{position:fixed;left:0;right:0;top:var(--top);z-index:30;border:0;background:transparent;padding:10px max(12px,env(safe-area-inset-right,0px)) 0 max(12px,env(safe-area-inset-left,0px))}
  .search{background:#fff;box-shadow:0 4px 16px rgba(22,32,46,.2);border-color:transparent}
  .results{left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));top:calc(100% + 4px);max-height:52vh}
  .toolbar{padding-top:0;flex-wrap:nowrap;gap:6px}
  .tb{padding:0 9px}
  .top p{display:none}
}
#locate{position:absolute;right:10px;bottom:92px;z-index:450;width:44px;height:44px;display:grid;place-items:center;border:2px solid rgba(0,0,0,.2);border-radius:8px;background:#fff;color:#2c3a4d;cursor:pointer;box-shadow:none}
#locate svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
#locate[data-state=on]{background:#2563eb;border-color:#2563eb;color:#fff}
#locate[data-state=wait]{color:#2563eb;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
.nearline{flex:none;padding:0 12px 8px;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nearline b{color:var(--ink);font-weight:600}
.nearline[hidden]{display:none}
.dist{font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;background:#e9f9ef;color:#0b7a3b;white-space:nowrap}
.addb{height:34px;padding:0 12px;border:0;border-radius:8px;background:var(--accent);color:#fff;font-size:13px;font-weight:600;cursor:pointer}
.lnk{border:0;background:none;color:var(--accent);font-size:12px;font-weight:600;cursor:pointer;padding:0}
#sharebox{position:fixed;inset:0;z-index:2000;display:grid;place-items:center;padding:16px;background:rgba(22,32,46,.45)}
#sharebox[hidden]{display:none}
.sbcard{width:min(480px,100%);padding:18px;border-radius:16px;background:var(--surface);box-shadow:0 16px 48px rgba(22,32,46,.35);display:flex;flex-direction:column;gap:12px}
.sbcard h2{margin:0;font-size:17px}
.sbcard p{margin:0;font-size:13px;color:var(--muted)}
.sbcard textarea{width:100%;min-height:88px;padding:10px;border:1.5px solid var(--line);border-radius:10px;font:12px/1.4 var(--mono);color:var(--ink);background:var(--bg);resize:none;word-break:break-all}
.sbrow{display:flex;gap:8px;justify-content:flex-end}
.tb.primary{background:var(--accent);border-color:var(--accent);color:#fff}
@media (prefers-reduced-motion:reduce){.panel,.toast{transition:none}#locate[data-state=wait]{animation:none}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="logo"><svg viewBox="0 0 24 24"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.800 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg></div>
    <div><h1>แผนที่สถานี 3BB ชัยภูมิ</h1><p>ค้นหาด้วยชื่อหรือ code แล้วเลือกหมุดที่ต้องการดู</p></div>
  </header>
  <div class="main">
    <aside class="panel collapsed" id="panel">
      <button class="grab" id="grab" aria-label="เปิดหรือปิดรายการที่เลือก"></button>
      <div class="searchwrap" id="searchwrap">
        <div class="search">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.500-3.500"/></svg>
          <input id="q" type="search" inputmode="search" enterkeyhint="search" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="พิมพ์ชื่อหรือ code เช่น บำเหน็จ, 1601" aria-label="ค้นหาชื่อหรือ code">
          <button class="x" id="qx" hidden aria-label="ล้างคำค้น">&times;</button>
        </div>
        <div class="results" id="results" hidden></div>
      </div>
      <div class="toolbar">
        <div class="count">เลือกแล้ว <b id="cnt">0</b> / <span id="tot"></span></div>
        <button class="tb" id="fit">ซูมรวม</button>
        <button class="tb" id="all" title="เลือกทุกหมุด">ทั้งหมด</button>
        <button class="tb danger" id="clear" title="ล้างหมุดทั้งหมด">ล้าง</button>
        <button class="tb" id="share" title="คัดลอกลิงก์พร้อมรายการที่เลือก">ลิงก์</button>
      </div>
      <div class="nearline" id="nearline" hidden></div>
      <div class="legend" id="legend"></div>
      <div class="list" id="list"></div>
    </aside>
    <div class="mapwrap">
      <div id="map"></div>
      <div class="hint" id="hint"><b>ยังไม่ได้เลือกหมุด</b><span>พิมพ์ชื่อหรือ code ที่ช่องค้นหา แล้วกดเลือกรายการ หมุดจะขึ้นบนแผนที่</span></div>
      <button id="locate" data-state="off" aria-label="แสดงตำแหน่งของฉัน" title="แสดงตำแหน่งของฉัน"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg></button>
      <div class="toast" id="toast"></div>
    </div>
  </div>
</div>
<div id="sharebox" hidden><div class="sbcard" role="dialog" aria-label="ลิงก์แชร์">
  <h2>ลิงก์แชร์หมุดที่เลือก</h2>
  <p id="sbinfo"></p>
  <textarea id="shareurl" readonly></textarea>
  <p id="sbmsg">กดปุ่มคัดลอก หรือกดค้างที่ช่องลิงก์แล้วเลือกคัดลอก</p>
  <div class="sbrow"><button class="tb" id="sbclose">ปิด</button><button class="tb primary" id="sbcopy">คัดลอกลิงก์</button></div>
</div></div>

function hav(a,b,c,d){const r=Math.PI/180,R=6371000,x=Math.sin((c-a)*r/2)**2+Math.cos(a*r)*Math.cos(c*r)*Math.sin((d-b)*r/2)**2;return 2*R*Math.asin(Math.sqrt(x))}
function fmt(m){return m<1000?Math.max(10,Math.round(m/10)*10)+' ม.':(m/1000).toFixed(m<10000?1:0)+' กม.'}
function dOf(o){return me?hav(me.lat,me.lng,o.lat,o.lng):0}
function nearest(n){
  if(!me)return[];
  const pool=sel.size?[...sel].map(c=>byCode.get(c)):ITEMS;

}

  return '<div class="pp"><div class="pp-code">'+esc(o.code)+'</div><div class="pp-name">'+esc(o.short||o.name)+'</div><dl>'

   +'<a class="pp-nav" target="_blank" rel="noopener" href="'+navUrl(o)+'">นำทางด้วย Google Maps</a></div>';

function makeMarker(o){
  const m=L.circleMarker([o.lat,o.lng],{radius:10,color:'#fff',weight:2.5,fillColor:colorOf(o.t1),fillOpacity:1}).bindPopup(()=>popupHtml(o),{maxWidth:300,autoPanPadding:[20,90]});
  if(!L.Browser.mobile)m.bindTooltip(esc(o.short||o.code),{direction:'top',offset:[0,-8]});
  m.addTo(layer);markers.set(o.code,m);
}
function fitSel(){
  const pts=[...sel].map(c=>byCode.get(c));
  if(!pts.length){map.fitBounds(allBounds,{padding:[30,30]});return}
  if(pts.length===1){map.setView([pts[0].lat,pts[0].lng],15);return}
  map.fitBounds(L.latLngBounds(pts.map(o=>[o.lat,o.lng])),{padding:[60,60],maxZoom:16});
}
function add(code,fit=true){
  const o=byCode.get(code);if(!o||sel.has(code))return;
  sel.add(code);makeMarker(o);changed();if(fit)fitSel();
}
function remove(code){
  if(!sel.has(code))return;
  sel.delete(code);const m=markers.get(code);if(m){layer.removeLayer(m);markers.delete(code)}changed();
}
function changed(){render();persist();renderResults()}
function persist(){
  const codes=[...sel];
  try{localStorage.setItem(KEY,JSON.stringify(codes))}catch(e){}
  try{history.replaceState(null,'',codes.length?'#s='+enc(codes):location.pathname+location.search)}catch(e){}
}

  ITEMS.forEach(o=>{total[o.t1]=(total[o.t1]||0)+1});

  $('legend').innerHTML=Object.keys(total).sort((a,b)=>total[b]-total[a]).map(t=>'<span><i class="dot" style="background:'+colorOf(t)+'"></i>'+esc(t)+' <b>'+(counts[t]||0)+'/'+total[t]+'</b></span>').join('');

  let html='';
  if(near.length){
    html+='<h3 class="grp"><span>ใกล้คุณที่สุด '+(sel.size?'(จากที่เลือก)':'(จากทุกสถานี)')+'</span><button class="lnk" data-stoploc>ปิดตำแหน่ง</button></h3>'

     +'<span class="dist">'+fmt(d)+'</span>'+(sel.has(o.code)?navA(o):'<button class="addb" data-add="'+esc(o.code)+'">+ เพิ่ม</button>')+'</div>').join('');

  }else{
    const groups={};
    sel.forEach(c=>{const o=byCode.get(c);(groups[o.amp]||(groups[o.amp]=[])).push(o)});
    let keys=Object.keys(groups);
    if(me){keys.forEach(k=>groups[k].sort((x,y)=>dOf(x)-dOf(y)));keys.sort((a,b)=>dOf(groups[a][0])-dOf(groups[b][0]))}

      +'<button class="rm" data-rm="'+esc(o.code)+'" aria-label="เอาหมุดออก">&times;</button></div>').join('')).join('');
  }
  $('list').innerHTML=html;
  $('list').scrollTop=keep;

$('list').addEventListener('click',e=>{

  if(ad){add(ad.dataset.add);return}

  const it=e.target.closest('.item');if(!it)return;
  const o=byCode.get(it.dataset.code),m=markers.get(o.code);
  if(!m){add(o.code);return}

  setTimeout(()=>m&&m.openPopup(),isPhone()?260:0);
});

let found=[],active=-1;
function search(q){
  const toks=q.toLowerCase().split(/\s+/).filter(Boolean);
  if(!toks.length)return[];
  const out=[];
  for(const o of ITEMS){
    if(!toks.every(t=>o.hay.includes(t)))continue;
    const t=toks[0];
    const s=o.code.toLowerCase().startsWith(t)?0:(o.short.toLowerCase().startsWith(t)?1:2);
    out.push([s,o]);
  }
  out.sort((a,b)=>a[0]-b[0]);
  return out.map(x=>x[1]);
}
function renderResults(){
  const q=$('q').value.trim();
  $('qx').hidden=!$('q').value;
  if(!q){$('results').hidden=true;found=[];return}
  found=search(q);
  const box=$('results');box.hidden=false;
  if(!found.length){box.innerHTML='<div class="noresult">ไม่พบรายการที่ตรงกับ "'+esc(q)+'"</div>';return}
  const shown=found.slice(0,40);
  box.innerHTML='<div class="res-head">พบ '+found.length+' รายการ'+(found.length>40?' (แสดง 40 รายการแรก พิมพ์เพิ่มเพื่อกรอง)':'')+'</div>'
   +shown.map((o,i)=>'<button class="result'+(sel.has(o.code)?' on':'')+(i===active?' act':'')+'" data-code="'+esc(o.code)+'"><i class="dot" style="background:'+colorOf(o.t1)+'"></i>'
   +'<span><span class="code">'+esc(o.code)+'</span><br><span class="nm">'+esc(o.short||o.name)+'</span><br><span class="sub">ต.'+esc(o.tum)+' อ.'+esc(o.amp)+' · '+esc(o.t1)+'</span></span>'
   +'<span class="pick">'+(sel.has(o.code)?'✓ เลือกแล้ว':'+ เพิ่ม')+'</span></button>').join('');
}
$('q').addEventListener('input',()=>{active=-1;renderResults()});
$('q').addEventListener('focus',renderResults);
$('q').addEventListener('keydown',e=>{
  if(e.key==='Enter'){const o=found[Math.max(active,0)];if(o){sel.has(o.code)?remove(o.code):add(o.code)}e.preventDefault()}
  else if(e.key==='ArrowDown'||e.key==='ArrowUp'){active=Math.max(0,Math.min(Math.min(found.length,40)-1,active+(e.key==='ArrowDown'?1:-1)));renderResults();const a=document.querySelector('.result.act');a&&a.scrollIntoView({block:'nearest'});e.preventDefault()}
  else if(e.key==='Escape'){$('results').hidden=true}
});
$('qx').addEventListener('click',()=>{$('q').value='';active=-1;renderResults();$('q').focus()});
$('results').addEventListener('click',e=>{
  const b=e.target.closest('.result');if(!b)return;
  const c=b.dataset.code;sel.has(c)?remove(c):add(c);
});
document.addEventListener('pointerdown',e=>{if(!e.target.closest('.searchwrap'))$('results').hidden=true});

/* toolbar */
$('fit').addEventListener('click',fitSel);
$('all').addEventListener('click',()=>{ITEMS.forEach(o=>{if(!sel.has(o.code)){sel.add(o.code);makeMarker(o)}});changed();fitSel()});
let armTimer;
$('clear').addEventListener('click',()=>{
  const b=$('clear');
  if(!sel.size)return;
  if(!b.classList.contains('armed')){b.classList.add('armed');b.textContent='กดอีกครั้ง';armTimer=setTimeout(disarm,3000);return}
  disarm();layer.clearLayers();markers.clear();sel.clear();changed();map.fitBounds(allBounds,{padding:[30,30]});
});
function disarm(){clearTimeout(armTimer);$('clear').classList.remove('armed');$('clear').textContent='ล้าง'}
function toast(t,ms){const e=$('toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),ms||1800)}
function shareLink(){
  const q=sel.size?enc([...sel]):'';
  return SHARE_BASE?SHARE_BASE+(q?'?s='+q:''):location.href.split('#')[0]+(q?'#s='+q:'');
}
$('share').addEventListener('click',()=>{
  $('shareurl').value=shareLink();
  $('sbinfo').textContent=sel.size?('คนที่เปิดลิงก์นี้จะเห็นหมุด '+sel.size+' รายการที่คุณเลือก'):'ยังไม่ได้เลือกหมุด ลิงก์นี้จะเปิดเป็นแผนที่ว่าง';
  $('sbmsg').textContent='กดปุ่มคัดลอก หรือกดค้างที่ช่องลิงก์แล้วเลือกคัดลอก';
  $('sharebox').hidden=false;
  $('shareurl').focus();$('shareurl').select();
});
$('sbcopy').addEventListener('click',()=>{
  const ta=$('shareurl'),url=ta.value;
  const done=ok=>{$('sbmsg').textContent=ok?'คัดลอกลิงก์แล้ว นำไปวางส่งทาง LINE ได้เลย':'คัดลอกอัตโนมัติไม่ได้ กดค้างที่ช่องลิงก์แล้วเลือกคัดลอกเอง'};
  const fb=()=>{ta.focus();ta.select();ta.setSelectionRange(0,url.length);let ok=false;try{ok=document.execCommand('copy')}catch(e){}done(ok)};
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(url).then(()=>done(true),fb);else fb();
});
$('sbclose').addEventListener('click',()=>{$('sharebox').hidden=true});
$('sharebox').addEventListener('pointerdown',e=>{if(e.target.id==='sharebox')$('sharebox').hidden=true});
$('grab').addEventListener('click',()=>$('panel').classList.toggle('collapsed'));
$('tot').textContent=ITEMS.length;

/* start: link first, then last session */
/* my location */
const locBtn=$('locate');
function setLoc(s){locBtn.dataset.state=s;locBtn.setAttribute('aria-pressed',s==='on')}
function setPeek(on){document.documentElement.style.setProperty('--sheet-peek',on?'120px':'92px')}
function fitMe(){
  const n=nearest(1);
  if(sel.size&&n.length)map.fitBounds(L.latLngBounds([[me.lat,me.lng],[n[0][1].lat,n[0][1].lng]]),{padding:[70,70],maxZoom:16});
  else map.setView([me.lat,me.lng],15);
}
function onFix(pos){
  const c=pos.coords,first=!me;
  me={lat:c.latitude,lng:c.longitude,acc:c.accuracy||0};
  if(!meDot){
    meAcc=L.circle([me.lat,me.lng],{radius:me.acc,color:'#2563eb',weight:1,fillColor:'#2563eb',fillOpacity:.12,interactive:false}).addTo(meLayer);
    meDot=L.circleMarker([me.lat,me.lng],{radius:8,color:'#fff',weight:3,fillColor:'#2563eb',fillOpacity:1,interactive:false}).addTo(meLayer);
  }else{meAcc.setLatLng([me.lat,me.lng]);meAcc.setRadius(me.acc);meDot.setLatLng([me.lat,me.lng])}
  setLoc('on');setPeek(true);
  if(first)fitMe();
  if(first||!lastR||hav(lastR.lat,lastR.lng,me.lat,me.lng)>20){lastR={lat:me.lat,lng:me.lng};render()}
}
function stopLoc(){
  if(watchId!==null&&navigator.geolocation)navigator.geolocation.clearWatch(watchId);
  watchId=null;meLayer.clearLayers();meDot=meAcc=null;me=null;lastR=null;setLoc('off');setPeek(false);render();
}
function onLocErr(err){
  const had=me;stopLoc();
  const msg={1:'ไม่ได้รับอนุญาตให้ใช้ตำแหน่ง ตรวจสอบการอนุญาตตำแหน่งของเบราว์เซอร์ หรือเปิดลิงก์ใน Chrome / Safari',2:'หาตำแหน่งไม่ได้ ลองเปิด GPS แล้วกดใหม่',3:'หาตำแหน่งนานเกินไป ลองกดใหม่อีกครั้ง'}[err&&err.code]||'หาตำแหน่งไม่ได้';
  toast(msg,5000);
}
locBtn.addEventListener('click',()=>{
  if(!navigator.geolocation){toast('เบราว์เซอร์นี้ไม่รองรับการหาตำแหน่ง',4000);return}
  if(watchId!==null){if(me)map.setView([me.lat,me.lng],Math.max(map.getZoom(),15));return}
  setLoc('wait');
  watchId=navigator.geolocation.watchPosition(onFix,onLocErr,{enableHighAccuracy:true,maximumAge:5000,timeout:20000});
});

let booted=false;
function boot(s){
  if(booted)return;booted=true;
  let codes=[];
  const m=location.hash.match(/^#[sc]=(.*)$/);
  if(s)codes=dec(s);
  else if(m){try{codes=dec(decodeURIComponent(m[1]))}catch(e){}}
  else{try{codes=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){}}
  codes.filter(c=>byCode.has(c)).forEach(c=>{sel.add(c);makeMarker(byCode.get(c))});
  render();
  if(sel.size){fitSel();persist()}
}
(function start(){
  const g=window.google&&google.script&&google.script.url&&google.script.url.getLocation;
  if(INIT_S||!g){boot(INIT_S);return}
  /* Apps Script: the page sits in an iframe, so ask Google for the address-bar parameters */
  setTimeout(()=>boot(''),2500);
  try{google.script.url.getLocation(loc=>{
    const p=loc&&loc.parameter&&loc.parameter.s;
    const h=loc&&loc.hash?String(loc.hash).replace(/^[sc]=/,''):'';
    boot((Array.isArray(p)?p[0]:p)||h||'');
  })}catch(e){boot('')}
})();
</script>
